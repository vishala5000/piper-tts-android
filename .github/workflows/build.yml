name: Build Piper TTS Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Download Piper Ryan High Model
        run: |
          mkdir -p app/src/main/assets

          wget -q \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-ryan-high.tar.bz2 \
            -O /tmp/ryan-high.tar.bz2

          tar -xjf /tmp/ryan-high.tar.bz2 -C /tmp

          rm -rf app/src/main/assets/vits-piper-en_US-ryan-high

          cp -r \
            /tmp/vits-piper-en_US-ryan-high \
            app/src/main/assets/

          echo "===== Piper model files ====="
          find app/src/main/assets/vits-piper-en_US-ryan-high -maxdepth 2 -type f -print

      - name: Verify Piper Model
        run: |
          MODEL_DIR="app/src/main/assets/vits-piper-en_US-ryan-high"

          test -f "$MODEL_DIR/en_US-ryan-high.onnx"
          test -f "$MODEL_DIR/tokens.txt"
          test -d "$MODEL_DIR/espeak-ng-data"

          echo "Piper model verified successfully."

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Piper-TTS-Studio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
