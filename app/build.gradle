plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pipertts.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pipertts.studio'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'com.github.k2-fsa:sherpa-onnx:v1.13.4'
}
